# Production stack: Django app + PostgreSQL + Caddy (automatic HTTPS).
# Usage on the server: cp .env.example .env, fill it in, then `docker compose up -d --build`.
services:
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://pulse:${POSTGRES_PASSWORD}@db:5432/pulse
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
