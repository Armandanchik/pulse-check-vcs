<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Grįžtamasis ryšys{% endblock %} · {{ group.program.name }}</title>
  <style>
    :root {
      --bg: #f5f4f0; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
      --line: #e2e0d9; --accent: #1f5eff; --error: #c62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --card: #1f1f1d; --text: #f2f1ec; --muted: #a3a29c;
        --line: #34332f; --accent: #3d6dff; --error: #ff7b7b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
    header { margin-bottom: 20px; }
    .eyebrow { color: var(--muted); font-size: 14px; margin: 0 0 4px; }
    h1 { font-size: 24px; line-height: 1.25; margin: 0; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: 20px 16px; margin-bottom: 12px;
    }
    fieldset { border: 0; padding: 0; margin: 0; }
    legend, label.text-label { font-weight: 600; margin-bottom: 12px; padding: 0; display: block; }
    .options { display: grid; gap: 8px; }
    .options.scale { grid-template-columns: repeat(5, 1fr); }
    .options.pace { grid-template-columns: repeat(3, 1fr); }
    .opt { position: relative; }
    .opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .opt span {
      display: flex; align-items: center; justify-content: center; text-align: center;
      min-height: 48px; padding: 6px 4px; border: 1.5px solid var(--line); border-radius: 10px;
      font-size: 15px; transition: border-color .15s, background .15s;
    }
    .opt input:checked + span { border-color: var(--accent); background: var(--accent); color: #fff; font-weight: 600; }
    .opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    .scale-hint { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; margin-top: 6px; }
    textarea {
      width: 100%; font: inherit; color: inherit; background: transparent;
      border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .help { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .error { color: var(--error); font-size: 14px; margin: 8px 0 0; }
    button {
      width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: var(--accent);
      color: #fff; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .center { text-align: center; }
    .big { font-size: 44px; margin: 0 0 8px; }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
