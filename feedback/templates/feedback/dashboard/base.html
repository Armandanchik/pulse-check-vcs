<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Rezultatai{% endblock %} · Pulse Check</title>
  <style>
    :root {
      --bg: #f5f4f0; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65; --line: #e2e0d9;
      --accent: #1f5eff; --good: #1b7f4b; --ok: #9a6b00; --bad: #c62828;
      --good-bg: #e3f4ea; --ok-bg: #fbf1d9; --bad-bg: #fde7e7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --card: #1f1f1d; --text: #f2f1ec; --muted: #a3a29c; --line: #34332f;
        --accent: #6f95ff; --good: #5fd49a; --ok: #f0c05a; --bad: #ff7b7b;
        --good-bg: #173325; --ok-bg: #3a2f14; --bad-bg: #3d1c1c;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    nav { display: flex; gap: 16px; align-items: center; padding: 12px 16px;
      border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; }
    nav strong { margin-right: auto; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 26px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 32px 0 12px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; }
    .kpi .label { color: var(--muted); font-size: 13px; }
    .kpi .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .table-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; }
    .pill { display: inline-block; min-width: 44px; text-align: center; padding: 1px 8px; border-radius: 999px; font-weight: 600; }
    .pill.good { color: var(--good); background: var(--good-bg); }
    .pill.ok { color: var(--ok); background: var(--ok-bg); }
    .pill.bad { color: var(--bad); background: var(--bad-bg); }
    .pill.empty { color: var(--muted); }
    .muted { color: var(--muted); }
    .alert { border-left: 4px solid var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
    .alert ul { margin: 4px 0 0; padding-left: 20px; }
    .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
    .chart-box { position: relative; height: 280px; }
    .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .button { display: inline-block; padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--text); }
    .comment { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .comment:last-child { border-bottom: 0; }
    .comment .meta { color: var(--muted); font-size: 13px; }
    .comment p { margin: 4px 0 0; white-space: pre-wrap; }
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  </style>
</head>
<body>
  <nav>
    <strong>Pulse Check VCS</strong>
    <a href="{% url 'feedback:dashboard' %}">Rezultatai</a>
    <a href="{% url 'admin:index' %}">Administravimas</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    // Shared chart defaults: 1–5 scale, gaps where a session is below the anonymity threshold.
    const css = getComputedStyle(document.documentElement);
    const COLORS = ["#1f5eff", "#e8710a", "#1b9e77", "#a33ea1", "#6b6a65"];
    if (window.Chart) {
      Chart.defaults.color = css.getPropertyValue("--muted").trim();
      Chart.defaults.borderColor = css.getPropertyValue("--line").trim();
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
    }
    function toDatasets(series, extra) {
      return Object.entries(series).map(([label, data], i) => ({
        label, data, borderColor: COLORS[i % COLORS.length], backgroundColor: COLORS[i % COLORS.length],
        spanGaps: false, tension: 0.25, pointRadius: 3, ...extra,
      }));
    }
    const SCALE = { min: 1, max: 5, ticks: { stepSize: 1 } };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
